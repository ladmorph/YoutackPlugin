<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTrack · ЦДР</title>
<link rel="stylesheet" href="youtrack-reference.css">
<link rel="stylesheet" href="youtrack-page-shell.css">
<link rel="stylesheet" href="youtrack-cdr.css">
</head>
<body>
<main class="cdr-main">
  <section class="panel" aria-labelledby="cdr-title">
    <div class="panel-header-row">
      <h2 id="cdr-title">ЦДР</h2>
      <button id="cdr-connect" class="cdr-btn" type="button">Обновить подключение</button>
    </div>
    <p class="hint">Ищет в выбранных проектах все задачи, на которые когда-либо навешивали тег, и считает их по значению выбранного поля. Задача входит в группу один раз; отдельно считается, сколько раз тег навешивали.</p>
    <div class="yt-row">
      <div class="yt-field"><label for="cdr-tag">Тег</label><input id="cdr-tag" type="text" maxlength="100" autocomplete="off"></div>
      <div class="yt-field"><label for="cdr-field">Поле для группировки</label><input id="cdr-field" type="text" maxlength="100" list="cdr-field-options" autocomplete="off"></div>
    </div>
    <datalist id="cdr-field-options"></datalist>
    <div class="yt-field" style="margin-top:14px">
      <label>Проекты <span id="cdr-selected-count" class="cdr-count"></span></label>
      <div id="cdr-projects" class="yt-chip-list">
        <span class="yt-chip-empty">Проекты появятся после подключения к YouTrack.</span>
      </div>
      <div class="yt-links">
        <a id="cdr-select-all" role="button" tabindex="0">Выбрать все</a>
        <a id="cdr-clear" role="button" tabindex="0">Снять всё</a>
      </div>
    </div>
    <div class="yt-row">
      <div class="yt-field">
        <label>Дата с</label>
        <button type="button" id="cdr-from" class="yt-date-btn"></button>
        <input type="date" id="cdr-from-value" hidden>
      </div>
      <div class="yt-field">
        <label>Дата по</label>
        <button type="button" id="cdr-to" class="yt-date-btn"></button>
        <input type="date" id="cdr-to-value" hidden>
      </div>
      <div class="cdr-actions">
        <button id="cdr-run" class="cdr-btn primary" type="button">Построить</button>
        <button id="cdr-stop" class="cdr-btn" type="button" disabled>Остановить</button>
      </div>
    </div>
    <p id="cdr-status" class="status" role="status"></p>
    <p id="cdr-error" class="error" role="alert" hidden></p>
  </section>
  <section id="cdr-result" class="panel" hidden aria-labelledby="cdr-result-title">
    <div class="cdr-result-head">
      <h2 id="cdr-result-title"></h2>
      <div id="cdr-total" class="cdr-kpis"></div>
    </div>
    <div class="cdr-card">
      <table class="cdr-table">
        <thead><tr id="cdr-head"></tr></thead>
        <tbody id="cdr-rows"></tbody>
      </table>
    </div>
  </section>
</main>
<script src="../feature-flags.js"></script>
<script src="youtrack-reference-network.js"></script>
<script src="youtrack-cdr.js"></script>
<script src="youtrack-page-shell.js"></script>
</body>
</html>
